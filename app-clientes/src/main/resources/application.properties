#1 Primeras Configuraciones
#----------------------------------
# Configuración de PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/db_examen
quarkus.datasource.username=postgres
quarkus.datasource.password=labcom,2015
# Encender Flyway
quarkus.flyway.migrate-at-start=true
# El puerto donde correrá app-clientes
quarkus.http.port=8080

#segunda parte
# Para que clientes se registre a sí mismo en Consul
consul.host=127.0.0.1
consul.port=8500
# Para que busque a "app-prestamos" dinámicamente usando Stork
quarkus.stork.app-prestamos.service-discovery.type=consul
quarkus.stork.app-prestamos.service-discovery.consul-host=127.0.0.1
quarkus.stork.app-prestamos.service-discovery.consul-port=8500
# Cambiamos localhost:8090 por la URL dinámica de Stork
quarkus.rest-client.prestamos-api.url=stork://app-prestamos

#--CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
