global:
  scrape_interval:     5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: app-prestamos
    scrape_interval: 10s
    metrics_path: /q/metrics
    static_configs:
      - targets: ['app-prestamos-container:8090']

  - job_name: app-clientes
    scrape_interval: 10s
    metrics_path: /q/metrics
    static_configs:
      - targets: ['app-clientes-container:8080']

  - job_name: proxy
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['traefik-proxy:8082']

  - job_name: postgresql
    scrape_interval: 10s
    static_configs:
      - targets: ['postgresql-exporter:9187']
