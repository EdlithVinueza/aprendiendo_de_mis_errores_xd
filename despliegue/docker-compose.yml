version: '3.8'
services:
  # 1. Base de datos compartida
  db-server:
    image: postgres:15-alpine
    container_name: db_examen_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: labcom,2015
      POSTGRES_DB: db_examen
    ports:
      - "5432:5432"

  # 2. Service Discovery (Consul)
  consul:
    image: consul:1.13.4
    container_name: consul-server
    command: "agent -dev -ui -bind=0.0.0.0 -client=0.0.0.0"
    ports:
      - "8501:8500"

  # 3. API Gateway / Proxy Inverso (Traefik) con Métricas
  proxy:
    image: traefik:3.7.5
    container_name: traefik-proxy
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.consulcatalog=true"
      - "--providers.consulcatalog.endpoint.address=consul-server:8500"
      - "--providers.consulcatalog.refreshInterval=5s"
      - "--entrypoints.web.address=:80"
      - "--entryPoints.traefik.address=:8080"
      - "--entryPoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
    ports:
      - "80:80"       # Puerto de la app unificada
      - "8888:8080"   # Puerto del Dashboard de Traefik
      - "8082:8082"   # Puerto de métricas de Traefik
    depends_on:
      - consul

  # 4. Microservicio de Préstamos
  prestamos-app:
    build:
      context: ../app-prestamos
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: app-prestamos-container
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db-server:5432/db_examen
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: "labcom,2015"
      CONSUL_HOST: consul-server
      CONSUL_PORT: 8500
    depends_on:
      - db-server
      - consul
      - proxy

  # 5. Microservicio de Clientes
  clientes-app:
    build:
      context: ../app-clientes
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: app-clientes-container
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db-server:5432/db_examen
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: "labcom,2015"
      CONSUL_HOST: consul-server
      CONSUL_PORT: 8500
      QUARKUS_STORK_APP_PRESTAMOS_SERVICE_DISCOVERY_CONSUL_HOST: consul-server
      QUARKUS_STORK_APP_PRESTAMOS_SERVICE_DISCOVERY_CONSUL_PORT: 8500
    depends_on:
      - prestamos-app
      - consul
      - proxy

  # 6. Prometheus (Recolector de métricas)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-server
    volumes:
      - ./configs:/etc/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - proxy
      - prestamos-app
      - clientes-app

  # 7. Grafana (Dashboard de métricas)
  grafana:
    image: grafana/grafana
    container_name: grafana-dashboard
    ports:
     - "3000:3000"
    depends_on:
      - prometheus

  # 8. PostgreSQL Exporter (Métricas de BD)
  postgresql-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgresql-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:labcom,2015@db-server:5432/db_examen?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - db-server
